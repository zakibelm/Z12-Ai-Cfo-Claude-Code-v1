
services:
  db:
    image: postgres:15-alpine
    container_name: z12_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_cfo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_cfo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - z12_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_cfo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: z12_backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_MODE: ${AUTH_MODE:-strict}
      SESSION_JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-${PUBLIC_URL:-http://localhost}}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://cfo.optigenius.pro}
      CHAT_ALLOWED_MODEL_PREFIXES: ${CHAT_ALLOWED_MODEL_PREFIXES:-anthropic/,google/,deepseek/,qwen/,meta-llama/,mistralai/}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_FROM:-}
      WHATSAPP_WHITELIST: ${WHATSAPP_WHITELIST:-}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      UPLOAD_DIR: /app/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CABINET_NAME: ${CABINET_NAME:-${COMPANY_NAME:-}}
      # Administration, inscription et budgets (voir .env.example). Sans ADMIN_USER_IDS,
      # aucun compte n'est administrateur et le RAG metier n'est pas servi.
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      GOOGLE_ALLOWED_EMAILS: ${GOOGLE_ALLOWED_EMAILS:-}
      TRIAL_BUDGET_CAD: ${TRIAL_BUDGET_CAD:-3}
      PLATFORM_MONTHLY_BUDGET_CAD: ${PLATFORM_MONTHLY_BUDGET_CAD:-150}
      USD_TO_CAD: ${USD_TO_CAD:-1.40}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      # Documents client : persistants entre deux déploiements
      - uploads_data:/app/uploads
    ports:
      # Lié à la boucle locale : le backend n'est joignable que par le proxy (nginx / proxy TLS de l'hôte)
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - z12_network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: z12_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - z12_network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:

networks:
  z12_network:
    driver: bridge
